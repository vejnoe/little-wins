
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f7f6f2">

<!-- PWA / iOS Web App Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Wins">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Little Wins — Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<header>
  <div class="total-row">
    <div class="total-left">
      <div class="coin-anchor" id="coin-anchor">
        <!--<svg viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="16" fill="#FBBF24" stroke="#111" stroke-width="2.5"/>
          <ellipse cx="18" cy="18" rx="10" ry="12" fill="#F59E0B" stroke="#111" stroke-width="1.5"/>
          <rect x="15.5" y="10" width="5" height="16" rx="2.5" fill="#FEF08A"/>
          <rect x="17" y="11" width="2" height="14" rx="1" fill="white"/>
          </svg>-->
          <img src="happy-coin.png" alt="coin" width="59" height="59">
      </div>
      <div>
        <div class="total-number num" id="total-points">0</div>
        <div class="coin-label">POINTS — <span class="eyebrow" id="today-label"></span></div>
      </div>
    </div>
    <button class="icon-button" id="add-button" aria-label="Opret opgave">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M12 4v16M4 12h16"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-view="today">I DAG</button>
    <button class="tab" data-view="history">HISTORIK</button>
  </div>

  <section id="today-view">
    <div class="task-list" id="task-list"></div>
    <button class="completed-toggle" id="completed-toggle" type="button" aria-pressed="false">Vis gennemførte</button>
  </section>

  <section id="history-view" hidden>
    <div class="section-heading">
      <h2 class="heading">Uge-overblik</h2>
      <div class="week-nav">
        <button class="nav-button" id="week-prev" aria-label="Forrige uge">‹</button>
        <span class="week-title" id="week-current"></span>
        <button class="nav-button" id="week-next" aria-label="Næste uge">›</button>
      </div>
    </div>
    <div class="week-list" id="week-list"></div>
    <p class="history-note">Hver dag tæller sine egne optjente point. Uger uden aktivitet vises også, så du kan følge historikken uden at skulle nå et bestemt mål.</p>
  </section>
</main>

<footer>
  <div class="footer-row">
    <span></span>
    <button class="settings-button" id="settings-button">⚙ Indstillinger</button>
  </div>
</footer>

</div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="close-button" id="close-modal" aria-label="Luk">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
