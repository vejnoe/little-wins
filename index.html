
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f7f6f2">

<!-- PWA / iOS Web App Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Wins">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="happy-coin.png">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Little Wins — Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app">

<header>
  <div class="total-row">
    <div class="total-left">
      <div class="coin-anchor" id="coin-anchor">
        <img src="happy-coin.png" alt="coin" width="59" height="59">
      </div>
      <div>
        <div class="total-number num" id="total-points">0</div>
        <div class="coin-label">POINTS — <span class="eyebrow" id="today-label"></span></div>
      </div>
    </div>
    <button class="icon-button" id="add-button" aria-label="Opret opgave">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M12 4v16M4 12h16"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-view="today">I DAG</button>
    <button class="tab" data-view="history">HISTORIK</button>
  </div>

  <section id="today-view">
    <div class="task-list" id="task-list"></div>
    <button class="log-completed" id="log-completed" type="button" hidden>Log gennemførte</button>
    <button class="show-logged" id="show-logged" type="button" hidden>Vis loggede opgaver</button>
  </section>

  <section id="history-view" hidden>
    <div class="section-heading">
      <h2 class="heading">Overblik</h2>
      <div class="week-nav">
        <button class="nav-button" id="history-prev" aria-label="Forrige 3 måneder">‹</button>
        <span class="week-title" id="history-range"></span>
        <button class="nav-button" id="history-next" aria-label="Næste 3 måneder">›</button>
      </div>
    </div>
    <div class="week-list" id="week-list"></div>
    <p class="history-note">Historikken viser tre måneder ad gangen. Er der ældre data, kan du bladre tre måneder tilbage eller frem. Uger uden aktivitet vises også.</p>
  </section>
</main>

<footer>
  <div class="footer-row">
    <button class="footer-button" id="changelog-button" type="button">🕘 Versionshistorik</button>
    <button class="footer-button" id="settings-button" type="button">⚙ Indstillinger</button>
  </div>
</footer>

</div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="close-button" id="close-modal" aria-label="Luk">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="overlay hidden" id="update-overlay" role="dialog" aria-modal="true" aria-labelledby="update-title">
  <div class="modal update-modal">
    <div class="update-badge" id="update-badge"></div>
    <h2 id="update-title"></h2>
    <p class="update-lead" id="update-lead"></p>
    <ul class="update-list" id="update-list"></ul>
    <button class="save-button" id="update-ok" type="button">Fedt, lad os gå!</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
